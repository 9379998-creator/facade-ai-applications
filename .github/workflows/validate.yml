name: Validate & Verify

on:
  push:
    branches: [main, chore/*, feat/*, fix/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Code Quality & Content Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test

      - name: Validate Content Schemas
        run: npm run validate:content

      - name: Scan for Sensitive Data & Secrets
        run: npm run scan:sensitive

      - name: Check for Oversized Files (>10MB)
        run: npm run check:large-files

      - name: Build Production Bundle
        run: npm run build
